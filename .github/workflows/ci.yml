name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # tetherd binds to Apple frameworks (ScreenCaptureKit, VideoToolbox,
    # AppKit) so the workspace only compiles on macOS. macos-26 (Xcode 26 /
    # macOS 26 SDK) is required: a transitive dep (apple-metal 0.8.8 via
    # screencapturekit) compiles a Swift bridge against macOS 26 Metal 4 APIs
    # (MTLSamplerReductionMode, MTLResidencySet, MTLLogState) absent from
    # older SDKs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Install build deps
        run: brew install nasm # turbojpeg-sys SIMD assembler
      - name: Build (whole workspace, incl. tetherd)
        run: cargo build --workspace --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --locked -- -D warnings
      # tether-protocol + tether-signal are GUI-free. tetherd's capture /
      # encode / clipboard / injection tests need a logged-in GUI session
      # (Screen Recording, VideoToolbox, NSPasteboard) that headless CI lacks,
      # so they are run locally during gate verification, not here.
      - name: Test (GUI-free crates)
        run: cargo test -p tether-protocol -p tether-signal --locked

  rust-windows:
    # tetherd's Windows backend (DXGI capture, SendInput, WASAPI) via the
    # `windows` crate. openh264 is built from source with cc; turbojpeg-sys
    # needs CMake + NASM; audiopus_sys builds libopus with CMake (preinstalled
    # on windows-latest; .cargo/config.toml sets CMAKE_POLICY_VERSION_MINIMUM
    # so CMake 4 accepts it). Formatting is already checked by the macOS job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        uses: ilammy/setup-nasm@v1 # turbojpeg-sys SIMD assembler
      - name: Check CMake
        run: cmake --version
      - name: Build (whole workspace, all targets)
        run: cargo build --workspace --all-targets --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Hardware-touching tests (WASAPI, clipboard, etc.) are #[ignore]d.
      # win::tests::this_machine_has_a_monitor relies on the runner's virtual
      # display being enumerable.
      - name: Test (whole workspace)
        run: cargo test --workspace --locked

  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
