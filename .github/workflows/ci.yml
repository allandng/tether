name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    # tetherd binds to Apple frameworks (ScreenCaptureKit, VideoToolbox,
    # AppKit) so the workspace only compiles on macOS. macos-26 (Xcode 26 /
    # macOS 26 SDK) is required: a transitive dep (apple-metal 0.8.8 via
    # screencapturekit) compiles a Swift bridge against macOS 26 Metal 4 APIs
    # (MTLSamplerReductionMode, MTLResidencySet, MTLLogState) absent from
    # older SDKs.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format check
        run: cargo fmt --all --check
      - name: Install build deps
        run: brew install nasm # turbojpeg-sys SIMD assembler
      - name: Build (whole workspace, all targets)
        run: cargo build --workspace --all-targets --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test (GUI-free crates)
        run: cargo test -p tether-protocol -p tether-signal --locked
      # tetherd's real capture / VideoToolbox / pasteboard / injection tests
      # need a logged-in GUI session with TCC grants that CI lacks
      # (encode::h264::, clipboard::macos::), so they run locally during gate
      # verification. Everything below is pure logic, a fake capturer or
      # loopback networking (real-hardware tests inside these modules, e.g.
      # audio::macos's ScreenCaptureKit ones, are #[ignore]d). The module
      # filters are an allowlist: a new test module runs here only once it is
      # added (and known not to need a GUI) — check with
      # `cargo test -p tetherd --lib -- --list`.
      - name: Test (tetherd, GUI-free unit tests)
        run: >-
          cargo test -p tetherd --lib --locked --
          adaptive:: audio::tests:: audio::macos::tests:: auth::
          capture::tests:: capture::macos::tests:: capture::pixel_buffer::tests::
          clipboard::tests:: config::
          control:: encode::tests:: encode::yuv:: files:: input::macos::tests::
          keymap:: macos_perms:: pipeline:: webrtc::
      # e2e_fake is left out: its ≥15 fps gate is CPU-bound in a debug build
      # (synthetic fill + JPEG per frame) and the hosted macOS VM measures
      # ~7.5 fps. The Windows job still gates on it; run it locally on a Mac.
      - name: Test (tetherd integration, fake capture + loopback)
        run: cargo test -p tetherd --locked --test connection --test webrtc_e2e

  rust-windows:
    # tetherd's Windows backend (DXGI capture, SendInput, WASAPI) via the
    # `windows` crate. openh264 is built from source with cc; turbojpeg-sys
    # needs CMake + NASM; audiopus_sys builds libopus with CMake (preinstalled
    # on windows-latest; .cargo/config.toml sets CMAKE_POLICY_VERSION_MINIMUM
    # so CMake 4 accepts it). Formatting is already checked by the macOS job.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install build deps
        uses: ilammy/setup-nasm@v1 # turbojpeg-sys SIMD assembler
      - name: Check CMake
        run: cmake --version
      - name: Build (whole workspace, all targets)
        run: cargo build --workspace --all-targets --locked
      - name: Clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Hardware-touching tests (WASAPI, clipboard, etc.) are #[ignore]d.
      # win::tests::this_machine_has_a_monitor relies on the runner's virtual
      # display being enumerable.
      - name: Test (whole workspace)
        run: cargo test --workspace --locked

  controller:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: controller
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: controller/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
