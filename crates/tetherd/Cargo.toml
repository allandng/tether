[package]
name = "tetherd"
description = "Tether host daemon: screen capture, input injection, frame streaming"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
anyhow = "1.0.102"
bytes.workspace = true
clap = { version = "4.6.1", features = ["derive"] }
ed25519-dalek = { version = "2", default-features = false, features = ["std"] }
futures-util = "0.3.32"
gethostname = "1.1.0"
getrandom = "0.4.3"
hex = "0.4"
hmac = "0.12"
# Opus for the system-audio track (Phase 10); libopus is built from source.
opus = "0.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
sha2 = "0.10"
subtle = "2.6.1"
tether-protocol.workspace = true
tether-signal = { version = "0.1.0", path = "../tether-signal" }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "fs", "io-util"] }
tokio-tungstenite = { version = "0.29", features = ["native-tls"] }
toml = "0.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
turbojpeg = "1.4.0"
webrtc = "0.17.1"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
core-graphics = { version = "0.25.0", features = ["highsierra"] }
objc2 = "0.6.4"
objc2-app-kit = "0.3.2"
objc2-core-foundation = "0.3.2"
objc2-core-media = "0.3.2"
objc2-core-video = "0.3.2"
objc2-foundation = "0.3.2"
objc2-video-toolbox = "0.3.2"
screencapturekit = "7.0.1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "windows")'.dependencies]
# Cisco's OpenH264, built from source by the cc crate (no cmake/nasm needed):
# vendor-neutral H.264 that works on any GPU (or none).
openh264 = "0.9"
openh264-sys2 = "0.9"
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    "Win32_Graphics_Gdi",
    "Win32_Media_Audio",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_DataExchange",
    "Win32_System_JobObjects",
    "Win32_System_LibraryLoader",
    "Win32_System_Memory",
    "Win32_System_Ole",
    "Win32_System_Pipes",
    "Win32_System_Power",
    "Win32_System_Threading",
    "Win32_UI_HiDpi",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
axum = "0.8.9"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
